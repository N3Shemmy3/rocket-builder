<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- 1. Solid Obsidian-Violet Background & Crisp 2px Technical Border -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#09020a" stroke="#302b35" stroke-width="2" />

  <!-- 2. Sweeping Orbital Ascent Trajectory Arc -->
  <path d="M 12 52 C 13 36, 22 22, 43 15.5" stroke="#bd73fa" stroke-width="2.5" stroke-linecap="round" />

  <!-- 3. Orbital Insertion Target Node -->
  <circle cx="50" cy="14" r="3" fill="#00ffc8" />

  <!-- 4. Ultra-Minimal Geometric Launch Vehicle (Angled 35° CW) -->
  <!-- Negative-space cutout mask ensures crisp separation over the trajectory arc at 16x16 -->
  <g transform="translate(30, 32) rotate(35)">
    <!-- Solid #09020a halo buffer to break the purple arc cleanly around the vehicle -->
    <path d="M 0 -17 L 11 11 L -11 11 Z" fill="#09020a" />

    <!-- Short Electric Cyan Thrust Dash -->
    <line x1="0" y1="11" x2="0" y2="17" stroke="#00ffc8" stroke-width="2.8" stroke-linecap="round" />

    <!-- Two Minimal Swept Fin Triangles -->
    <polygon points="-4.2,1 -9.5,9.5 -4.2,7.5" fill="#f6f2ff" />
    <polygon points="4.2,1 9.5,9.5 4.2,7.5" fill="#f6f2ff" />

    <!-- Pointed Delta-Cone Fuselage -->
    <polygon points="0,-14 3.6,7.5 -3.6,7.5" fill="#f6f2ff" />
  </g>
</svg>